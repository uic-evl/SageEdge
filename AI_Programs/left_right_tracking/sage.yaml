name: "pedestrian-direction-tracker"
namespace: "sage"
version: "1.0.6"

description: "Pedestrian-Direction-Tracker uses YOLOv8 + built-in tracking to estimate simple pedestrian flow (left vs right) from either a Waggle camera or a video/RTSP stream."
authors: "Michael Cortez; Om Patel; Elizabeth Cardoso; Fatima Mora Garcia;"
collaborators: "The Sage Team"
funding: "NSF Grants: 2436842, 1935984, 2331263"
license: "MIT License"
keywords: "pedestrian, people-tracking, YOLOv8, ByteTrack, edge AI, education"
homepage: ""

source:
  url: "https://github.com/Cortez-Michael/ECR_left_right_privacy_tracker.git"
  branch: "main"
  dockerfile: "Dockerfile"
  directory: ""
  architectures:
    - "linux/arm64"

inputs:
  - id: "stream"
    type: "string"
    description: "File path or RTSP/HTTP URL. Preferred video source."

  - id: "camera_fallback"
    type: "boolean"
    description: "If true and no stream is provided, use the Waggle camera."

  - id: "camera"
    type: "string"
    description: "Waggle camera name (e.g., left/right) when camera_fallback is enabled."

  - id: "model"
    type: "string"
    description: "YOLOv8 model size (n/s/m/l/x)."

  - id: "dir_thresh"
    type: "int"
    description: "Pixel displacement needed to classify movement direction."

  - id: "live_output"
    type: "boolean"
    description: "Show live OpenCV window (for development only)."

  - id: "save_output"
    type: "boolean"
    description: "If true, save processed video output to OUT_PATH."

  - id: "out_path"
    type: "string"
    description: "Output video path when save_output is true (e.g. output.mp4)."

  - id: "conf"
    type: "float"
    description: "Person detection confidence threshold (0-1). Default 0.55."

  - id: "imgsz"
    type: "int"
    description: "YOLO inference image size in pixels. Default 640."

  - id: "face_blur"
    type: "boolean"
    description: "Enable face blurring for privacy. Default true."

  - id: "face_every"
    type: "int"
    description: "Run face detection every N frames (higher = faster). Default 1."
